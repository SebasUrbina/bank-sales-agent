[project]
name = "bank-sales-agent"
version = "0.1.0"
description = "Agente comercial bancario con Clean Architecture, LangChain y Google Chat"
requires-python = ">=3.12"
dependencies = [
  "databricks-sql-connector>=4.0,<5",
  "fastapi>=0.116,<1",
  "google-auth>=2.40,<3",
  "httpx>=0.28,<1",
  "langchain>=1.1,<2",
  "langchain-openai>=1.1,<2",
  "langgraph-checkpoint-mongodb>=0.5,<0.6",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pre-commit>=4.6.2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=7.1.0",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_sales_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=bank_sales_agent",
  "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["bank_sales_agent"]

[tool.coverage.report]
fail_under = 73
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
