[project]
name = "bank-sales-agent"
version = "0.1.0"
description = "Agente comercial bancario con Clean Architecture, LangChain y Google Chat"
requires-python = ">=3.12"
dependencies = [
  "bank-sales-contracts==0.3.0",
  "fastapi>=0.116,<1",
  "fastmcp>=2.13.3,<2.14",
  "google-auth>=2.40,<3",
  "httpx>=0.28,<1",
  "langchain>=1.1,<2",
  "langchain-openai>=1.1,<2",
  "langgraph-checkpoint-mongodb>=0.5,<0.6",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "pyjwt>=2.10,<3",
  "pyrefly>=1.3.1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "bank-sales-mcp==0.1.0",
  "mypy>=1.17,<2",
  "pre-commit>=4.6.2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=7.1.0",
  "ruff>=0.12,<1",
]

[tool.pyrefly.errors]
redundant-cast = "warn"
unannotated-return = "error"
implicit-any = "error"
no-any-return = "error"
implicit-any-parameter = "error"


[tool.uv.sources]
bank-sales-contracts = { path = "packages/bank-sales-contracts" }
bank-sales-mcp = { path = "mcp-server" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = [".", "packages/bank-sales-contracts", "mcp-server"]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=app",
  "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 73
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pyrefly]
python-version = "3.12.0"
preset = "legacy"
check-unannotated-defs = true
infer-return-types = "never"
