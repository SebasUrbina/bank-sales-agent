[project]
name = "bank-sales-mcp"
version = "0.1.0"
description = "Servidor externo FastMCP para tools comerciales bancarias"
requires-python = ">=3.12"
dependencies = [
  "bank-sales-contracts==0.2.0",
  "databricks-sql-connector>=4.0,<5",
  "fastmcp>=2.13.3,<2.14",
  "pydantic-settings>=2.10,<3",
]

[project.scripts]
bank-sales-mcp = "bank_sales_mcp.main:main"

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[tool.uv.sources]
bank-sales-contracts = { path = "../packages/bank-sales-contracts" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bank_sales_mcp"]

[tool.pytest.ini_options]
pythonpath = [".", "../packages/bank-sales-contracts"]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
